name: Validate specification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: rrpauls/esra-agents
          path: implementations/esra-agents
      - uses: actions/checkout@v5
        with:
          repository: rrpauls/chatgpt-esra
          path: implementations/chatgpt-esra
      - uses: actions/checkout@v5
        with:
          repository: rrpauls/claude-esra
          path: implementations/claude-esra
      - uses: actions/checkout@v5
        with:
          repository: rrpauls/hermes-esra
          path: implementations/hermes-esra
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate licensing and core documents
        run: |
          grep -q "Apache License" LICENSE
          test -s NOTICE
          test -s CONTRIBUTING.md
          grep -q "Apache-2.0 License" README.md
          test -s docs/ESRA_Technical_Specification.md
          test -s docs/ESRA_Loop_Execution_Protocol.md
          test -s docs/ESRA_Data_Contracts.md
      - run: python -m unittest discover -s conformance -v
      - name: Run cross-implementation exporter benchmark
        run: |
          python benchmarks/run.py \
            --implementations-root implementations \
            --json-output "$RUNNER_TEMP/esra-benchmark.json" \
            --markdown-output "$RUNNER_TEMP/esra-benchmark.md"
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esra-exporter-benchmark
          path: |
            ${{ runner.temp }}/esra-benchmark.json
            ${{ runner.temp }}/esra-benchmark.md
          if-no-files-found: error
