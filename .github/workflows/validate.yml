name: Validate specification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate licensing and core documents
        run: |
          grep -q "Apache License" LICENSE
          test -s NOTICE
          test -s CONTRIBUTING.md
          grep -q "Apache-2.0 License" README.md
          test -s docs/ESRA_Technical_Specification.md
          test -s docs/ESRA_Loop_Execution_Protocol.md
          test -s docs/ESRA_Data_Contracts.md
      - run: python -m unittest discover -s conformance -v
